! Rebuilt from my lab notes, not a raw show running-config export.
! GNS3, Cisco c7200, FastEthernet only.
!
hostname P1
!
no ip domain-lookup
ip cef
!
mpls label protocol ldp
mpls ldp router-id Loopback0 force
!
interface Loopback0
 ip address 3.3.3.3 255.255.255.255
 ip ospf 1 area 0
!
interface FastEthernet0/0
 description to-PE1
 ip address 10.0.0.2 255.255.255.252
 ip ospf network point-to-point
 ip ospf 1 area 0
 mpls ip
 no shutdown
!
interface FastEthernet0/1
 description to-P2
 ip address 10.0.0.5 255.255.255.252
 ip ospf network point-to-point
 ip ospf 1 area 0
 mpls ip
 no shutdown
!
router ospf 1
 router-id 3.3.3.3
!
end
