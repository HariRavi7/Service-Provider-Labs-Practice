! Rebuilt from my lab notes, not a raw show running-config export.
! GNS3, Cisco c7200, FastEthernet only.
!
hostname P2
!
no ip domain-lookup
ip cef
!
mpls label protocol ldp
mpls ldp router-id Loopback0 force
!
interface Loopback0
 ip address 4.4.4.4 255.255.255.255
 ip ospf 1 area 0
!
interface FastEthernet0/0
 description to-P1
 ip address 10.0.0.6 255.255.255.252
 ip ospf network point-to-point
 ip ospf 1 area 0
 mpls ip
 no shutdown
!
interface FastEthernet0/1
 description to-PE2
 ip address 10.0.0.9 255.255.255.252
 ip ospf network point-to-point
 ip ospf 1 area 0
 mpls ip
 no shutdown
!
router ospf 1
 router-id 4.4.4.4
!
end
