! Rebuilt from my lab notes, not a raw show running-config export.
! GNS3, Cisco c7200, FastEthernet only.
!
hostname PE1
!
no ip domain-lookup
ip cef
!
mpls label protocol ldp
mpls ldp router-id Loopback0 force
!
vrf definition A
 rd 65000:1
 address-family ipv4
  route-target export 65000:1
  route-target import 65000:1
 exit-address-family
!
vrf definition B
 rd 65000:2
 address-family ipv4
  route-target export 65000:2
  route-target import 65000:2
 exit-address-family
!
interface Loopback0
 ip address 1.1.1.1 255.255.255.255
 ip ospf 1 area 0
!
interface FastEthernet0/0
 description to-P1
 ip address 10.0.0.1 255.255.255.252
 ip ospf network point-to-point
 ip ospf 1 area 0
 mpls ip
 no shutdown
!
interface FastEthernet0/1
 description to-CE-A1
 vrf forwarding A
 ip address 192.168.1.1 255.255.255.252
 no shutdown
!
interface FastEthernet1/0
 description to-CE-B1
 vrf forwarding B
 ip address 192.168.2.1 255.255.255.252
 no shutdown
!
router ospf 1
 router-id 1.1.1.1
!
router bgp 65000
 bgp router-id 1.1.1.1
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 neighbor 2.2.2.2 remote-as 65000
 neighbor 2.2.2.2 update-source Loopback0
 !
 address-family vpnv4
  neighbor 2.2.2.2 activate
  neighbor 2.2.2.2 send-community extended
 exit-address-family
 !
 address-family ipv4 vrf A
  redistribute connected
  redistribute static
 exit-address-family
 !
 address-family ipv4 vrf B
  redistribute connected
  redistribute static
 exit-address-family
 !
!
ip route vrf A 10.1.1.0 255.255.255.0 192.168.1.2
ip route vrf B 10.1.1.0 255.255.255.0 192.168.2.2
!
end
